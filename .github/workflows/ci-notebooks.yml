name: CI (notebooks)

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

concurrency:
  group: ci-notebooks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notebooks:
    name: Notebook checks
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v4

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: 🦾 Install dev tooling (ruff + nbformat)
        run: uv sync --only-dev --frozen

      # Collect only the plain, tracked lesson notebooks: git ls-files omits the
      # gitignored .venv, and grep drops the inputs/ test fixtures.
      - name: 📓 Collect lesson notebooks
        id: nb
        run: echo "files=$(git ls-files '*.ipynb' | grep -v '/inputs/' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      # 1. Validity — every collected notebook conforms to the nbformat schema.
      - name: ✅ Validate notebooks
        run: |
          uv run --no-sync python - ${{ steps.nb.outputs.files }} <<'PY'
          import sys
          import nbformat
          bad = []
          for f in sys.argv[1:]:
              try:
                  nbformat.validate(nbformat.read(f, as_version=4))
              except Exception as e:
                  bad.append((f, e))
          for f, e in bad:
              print("INVALID", f, e)
          sys.exit(1 if bad else 0)
          PY

      # 2. Lint + format (ruff handles ! shell + magics; teaching-notebook ignores in pyproject.toml).
      - name: 💅 Format check
        run: uv run --no-sync ruff format --check ${{ steps.nb.outputs.files }}

      - name: 🔎 Lint check
        run: uv run --no-sync ruff check ${{ steps.nb.outputs.files }}
